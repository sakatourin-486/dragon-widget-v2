name: Build SaKaTouRin APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 解压源码
        run: unzip -q 'SaKaTouRin-v0.7-source.zip' -d source

      - name: 编译 APK
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          icon = Path("source/app/src/main/res/drawable-nodpi/sktr_mark.png")
          with Image.open(icon) as image:
              fixed = image.convert("RGBA")
          fixed.save(icon, format="PNG")

          config = Path("source/app/src/main/res/xml/network_security_config.xml")
          text = config.read_text()
          text = text.replace("<domain>", '<domain includeSubdomains="false">')
          config.write_text(text)

          build = Path("source/app/build.gradle")
          with build.open("a") as file:
              file.write("\nandroid { lint { disable 'ExpiredTargetSdkVersion' } }\n")
          PY
          gradle -p source assembleRelease --no-daemon

      - name: 固定签名并验证
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?请添加签名文件 Secret}"
          : "${KEYSTORE_PASSWORD:?请添加签名密码 Secret}"
          umask 077
          signing_file="$RUNNER_TEMP/sakatourin-signing.p12"
          trap 'rm -f "$signing_file"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          mkdir -p output
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$signing_file" \
            --ks-type PKCS12 \
            --ks-key-alias sakatourin \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out output/SaKaTouRin.apk \
            source/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose output/SaKaTouRin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SaKaTouRin-APK
          path: output/SaKaTouRin.apk
          if-no-files-found: error
